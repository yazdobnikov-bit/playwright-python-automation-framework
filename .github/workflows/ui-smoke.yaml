
name: UI Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout automation framework
        uses: actions/checkout@v4

      - name: Checkout test application
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-software-testing

      - name: Show application version
        working-directory: practice-software-testing
        run: |
          echo "=== Application commit SHA ==="
          git rev-parse HEAD

          echo "=== Application commit details ==="
          git log -1 --format="%h %ad %s" --date=iso

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Start test application
        working-directory: practice-software-testing
        run: docker compose up -d

      - name: Wait for Composer
        working-directory: practice-software-testing
        run: docker compose wait composer

      - name: Fix Laravel permissions
        working-directory: practice-software-testing
        run: |
          docker compose exec -T --user root laravel-api sh -c \
            'chown -R www-data:www-data storage bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache'

      - name: Initialize test data
        working-directory: practice-software-testing
        run: bash init-data.sh

      - name: Wait for application readiness
        run: |
          # Angular may require several minutes for its initial build.
          ATTEMPTS=100

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Checking application readiness (attempt $attempt/$ATTEMPTS)..."

            frontend_status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://127.0.0.1:4200/ || true)

            api_status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://127.0.0.1:8091/products || true)

            echo "Frontend status: $frontend_status"
            echo "Products API status: $api_status"

            if [ "$frontend_status" = "200" ] && [ "$api_status" = "200" ]; then
              echo "Application is ready."
              exit 0
            fi

            echo "Application is not ready yet. Waiting 3s..."
            sleep 3
          done

          echo "::error::Application failed to become ready."
          exit 1

      - name: Run UI smoke tests
        run: |
          uv run pytest tests/ui \
            -m smoke \
            --browser chromium \
            --base-url http://127.0.0.1:4200 \
            -v

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-chromium
          path: |
            test-results/
          if-no-files-found: ignore

      - name: Show final Docker logs
        if: failure()
        working-directory: practice-software-testing
        run: |
          echo "=== Final container status ==="
          docker compose ps -a

          echo "=== Final Angular logs ==="
          docker compose logs --tail=100 angular-ui

          echo "=== Final frontend check ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            --max-time 10 http://127.0.0.1:4200/ || true
