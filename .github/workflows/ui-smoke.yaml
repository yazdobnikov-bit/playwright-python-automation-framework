name: UI Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout test application
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-software-testing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python version
        run: python --version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Verify uv version
        run: uv --version

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run Ruff lint
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Start test application
        working-directory: practice-software-testing
        run: docker compose up -d

      - name: Initialize test data
        working-directory: practice-software-testing
        run: bash init-data.sh

      - name: Wait for test application
        run: |
          ATTEMPTS=20
          TIMEOUT=3
          URL="http://localhost:4200"

          for i in $(seq 1 $ATTEMPTS); do
            echo "Checking service (attempt $i/$ATTEMPTS)..."

            if curl --fail --silent --show-error "$URL" > /dev/null; then
              echo "Service is ready."
              exit 0
            fi

            sleep "$TIMEOUT"
          done

          echo "Error: Service failed to start."
          exit 1

      - name: Run smoke tests
        run: uv run pytest -m smoke -v --base-url http://localhost:4200

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

      - name: Show test application logs
        if: failure()
        working-directory: practice-software-testing
        run: docker compose logs --no-color