name: UI Regression Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  regression:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout test application
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-software-testing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Install ${{ matrix.browser }}
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run Ruff lint
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Start test application
        working-directory: practice-software-testing
        run: docker compose up -d

      - name: Wait for Composer
        working-directory: practice-software-testing
        run: docker compose wait composer

      - name: Initialize test data
        working-directory: practice-software-testing
        run: bash init-data.sh

      - name: Wait for test application
        run: |
          ATTEMPTS=20
          TIMEOUT=3
          FRONTEND_URL="http://localhost:4200"
          PRODUCTS_URL="http://localhost:8091/products"

          for i in $(seq 1 $ATTEMPTS); do
            echo "Checking application readiness (attempt $i/$ATTEMPTS)..."

            FRONTEND_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --connect-timeout 2 --max-time 5 "$FRONTEND_URL" || true)

            PRODUCTS_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --connect-timeout 2 --max-time 5 "$PRODUCTS_URL" || true)

            FRONTEND_STATUS=${FRONTEND_STATUS:-000}
            PRODUCTS_STATUS=${PRODUCTS_STATUS:-000}

            echo "Frontend status: $FRONTEND_STATUS"
            echo "Products API status: $PRODUCTS_STATUS"

            if [ "$FRONTEND_STATUS" = "200" ] && [ "$PRODUCTS_STATUS" = "200" ]; then
              echo "Application is ready."
              exit 0
            fi

            echo "Application is not ready yet. Waiting ${TIMEOUT}s..."
            sleep "$TIMEOUT"
          done

          echo "Error: Application failed to become ready."
          exit 1
          
      - name: Run regression tests
        run: uv run pytest -m regression -v --browser ${{ matrix.browser }} --base-url http://localhost:4200

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

      - name: Show backend diagnostics
        if: failure()
        working-directory: practice-software-testing
        run: |
          echo "=== Product count ==="
          docker compose exec -T laravel-api \
            php artisan tinker --execute="dump(App\Models\Product::count());" || true

          echo "=== Laravel log files ==="
          docker compose exec -T laravel-api sh -c \
            'ls -lah storage/logs || true'

          echo "=== Laravel application log ==="
          docker compose exec -T laravel-api sh -c \
            'tail -n 300 storage/logs/laravel.log 2>/dev/null || true'

          echo "=== /products response ==="
          curl -i http://localhost:8091/products || true

          echo "=== Laravel container logs ==="
          docker compose logs --tail=200 laravel-api

      - name: Show test application logs
        if: failure()
        working-directory: practice-software-testing
        run: docker compose logs --no-color
