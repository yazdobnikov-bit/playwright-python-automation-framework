name: UI Regression Tests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout automation framework
        uses: actions/checkout@v4

      - name: Checkout test application
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-software-testing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Start test application
        working-directory: practice-software-testing
        run: docker compose up -d

      - name: Wait for Composer
        working-directory: practice-software-testing
        run: docker compose wait composer

      - name: Fix Laravel permissions
        working-directory: practice-software-testing
        run: |
          docker compose exec -T --user root laravel-api sh -c \
            'chown -R www-data:www-data storage bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache'

      - name: Initialize test data
        working-directory: practice-software-testing
        run: bash init-data.sh

      # Temporary diagnostics
      - name: Debug application containers
        if: always()
        working-directory: practice-software-testing
        run: |
          echo "=== Docker Compose status ==="
          docker compose ps -a

          echo "=== Docker Compose logs ==="
          docker compose logs --tail=150

          echo "=== Frontend HTTP check ==="
          curl -v --max-time 10 http://localhost:4200/ || true

          echo "=== Backend HTTP check ==="
          curl -v --max-time 10 http://localhost:8091/products || true

      - name: Wait for application readiness
        run: |
          # Angular may require several minutes for its initial build in CI.
          ATTEMPTS=100

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Checking application readiness (attempt $attempt/$ATTEMPTS)..."

            frontend_status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost:4200/ || true)

            api_status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost:8091/products || true)

            echo "Frontend status: $frontend_status"
            echo "Products API status: $api_status"

            if [ "$frontend_status" = "200" ] && [ "$api_status" = "200" ]; then
              echo "Application is ready."
              exit 0
            fi

            echo "Application is not ready yet. Waiting 3s..."
            sleep 3
          done

          echo "::error::Application failed to become ready."
          exit 1

      - name: Run UI regression tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4200
        run: |
          uv run pytest tests/ui \
            -m regression \
            --browser ${{ matrix.browser }} \
            -v

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-${{ matrix.browser }}
          path: |
            test-results/
          if-no-files-found: ignore

      - name: Show final Docker logs
        if: failure()
        working-directory: practice-software-testing
        run: |
          echo "=== Final container status ==="
          docker compose ps -a

          echo "=== Final Angular logs ==="
          docker compose logs --tail=200 angular-ui

          echo "=== Angular processes ==="
          docker compose exec -T angular-ui ps aux || true

          echo "=== Final frontend check ==="
          curl -v --max-time 10 http://127.0.0.1:4200/ || true
